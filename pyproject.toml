[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omarchy-meshcore"
version = "0.2.1"
requires-python = ">=3.11"
description = "MeshCore messaging and private local AI for Omarchy"
readme = "README.md"
license = {file = "LICENSE"}
[project.optional-dependencies]
radio = ["meshcore==2.3.14"]
[project.scripts]
meshcore-bridge = "meshcore_bridge.daemon:main"
[tool.setuptools.packages.find]
include = ["meshcore_bridge*"]
